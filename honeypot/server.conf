# Default mode: detect bot-bait requests (the "honey" in honey.conf) and return
# 410 Gone. This is pure NGINX config and needs nothing but NGINX itself.
#
# To also BAN the offending IP, include ONE of these *instead* of this file:
#   honeypot/server-ban-fcgiwrap.conf  - free, bans via fcgiwrap + ipset
#   honeypot/server-ban-nftset.conf    - Pro,  bans via nginx-module-nftset-access
# See the README for the one-time firewall / module setup each path needs.
if ($has_flies = 1) {
    return 410;
}
