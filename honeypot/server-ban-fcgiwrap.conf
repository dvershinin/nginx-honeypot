# Free ban path: return 410 and hand the request to a fcgiwrap handler that adds the
# client IP to the honeypot4 / honeypot6 ipsets (kernel drops further packets).
# Include this INSTEAD of server.conf. Needs: fcgiwrap, ipset, sudo, conntrack-tools,
# the honeypot ipsets + DROP rule, and the sudoers drop-in. See the README.
error_page 410 = @honeypot;
if ($has_flies = 1) {
    return 410;
}
location @honeypot {
    include honeypot/handler.conf;
}
