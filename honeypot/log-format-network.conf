# Honeypot network mode: one JSON object per trap hit, shipped to the central
# server by nginx-honeypot-report. Include at http{} level. Keep the fields in
# step with HoneypotFeedService on the receiving side.
#   client = address after real_ip, peer = actual TCP peer (validated centrally)
log_format honeypot_event escape=json
    '{"time":"$time_iso8601",'
    '"client":"$remote_addr",'
    '"peer":"$realip_remote_addr",'
    '"host":"$host",'
    '"uri":"$request_uri",'
    '"method":"$request_method",'
    '"ua":"$http_user_agent",'
    '"referer":"$http_referer",'
    '"sec_fetch_site":"$http_sec_fetch_site",'
    '"sec_fetch_mode":"$http_sec_fetch_mode"}';
