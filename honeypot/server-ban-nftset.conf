# Pro ban path: return 410 and add the client IP straight into an nftables set from
# inside NGINX - no fcgiwrap, no CGI, no sudo. Requires the nginx-module-nftset-access
# module (GetPageSpeed NGINX Extras, Pro plan) and a one-time nftables set + DROP rule.
# Include this INSTEAD of server.conf. See the README for the nft setup.
error_page 410 = @honeypot;
if ($has_flies = 1) {
    return 410;
}
location @honeypot {
    nftset_autoadd filter:honeypot timeout=86400 status=410;
}
