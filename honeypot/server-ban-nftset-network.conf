# Network mode: same trap as server-ban-nftset.conf, and every hit is also
# logged for nginx-honeypot-report to ship to the central server. The access_log
# must live in this location so that only trap hits reach the event log.
# Requires log-format-network.conf at http{} level, and the sets from the README.
#
# Replace gps_honeypot:detected with filter:honeypot to ban locally as well. As
# written, the set has no drop rule: the collector only observes.
error_page 410 = @honeypot;
if ($has_flies = 1) {
    return 410;
}
location @honeypot {
    access_log /var/log/nginx/honeypot-events.log honeypot_event;
    nftset_autoadd gps_honeypot:detected timeout=86400 status=410;
}
